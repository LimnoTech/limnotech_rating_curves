[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "limnotech-rating-curves"
version = "1.1.0"
description = "Probabilistic stage-discharge rating curves"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
    { name = "Dennis Farmer", email = "dennisfj@umich.edu" },
    { name = "Jenna Kutscher" },
]

dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "pymc>=5.16,<6",
    "arviz>=0.18,<1",
    "ratingcurve>=1.0.3",
    "nutpie>=0.13",
    "numba",
    "numpyro",
    "blackjax",
    "matplotlib>=3.8",
    "plotly>=5.20",
    "dataretrieval>=1.0",
    "openpyxl>=3.1",
    "netcdf4",
    "pyarrow",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "jupyter",
    "ipykernel",
    "nbformat",
    "pytest>=8.0",
    "pytest-cov",
]

[project.optional-dependencies]
pagaia = ["fb-pagaia @ git+https://github.com/LimnoTech/fb-pagaia.git"]

[project.urls]
Homepage = "https://github.com/LimnoTech/limnotech-rating-curves"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"limnotech_rating_curves.data" = ["*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "slow: runs a sampler, so it takes seconds rather than milliseconds",
    "network: calls a live web service, so it is skipped unless LRC_NETWORK_TESTS=1",
]
